[project]
name = "pp-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "authlib>=1.9.1",
    "fastapi[standard]>=0.143.0",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "itsdangerous>=2.2.0",
    "pydantic-settings>=2.15.0",
    "selectolax>=1.0.0",
    "sqlmodel>=0.0.48",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
packages = ["app"]
ignore_missing_imports = true
warn_unused_ignores = false
